# CI for the Time Tracking extension.
#
# On every push to main and on merge requests, run the quality gate (types, lint, unit tests).
# On a version tag (e.g. 0.1.0 or v0.1.0), additionally build time-tracking-<tag>.vsix and publish
# it to Open VSX.
#
# Required CI/CD variable (Settings > CI/CD > Variables):
#   OVSX_TOKEN  Open VSX access token. Mark it Masked. If you also mark it Protected, you must
#               protect the tags too (Settings > Repository > Protected tags, e.g. pattern "*"),
#               otherwise the variable is not exposed to the publish job and it will fail.
#
# vsce and ovsx need Node 20 (undici uses the global File), hence the node:20 image.

stages:
  - test
  - publish

default:
  image: node:20
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/

test:
  stage: test
  script:
    - npm ci
    - npm run check-types
    - npm run lint
    - npm run test:unit
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

publish:
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG' # only on a version tag
  script:
    # Strip an optional leading "v" so both "0.1.0" and "v0.1.0" work.
    - VERSION="${CI_COMMIT_TAG#v}"
    - npm ci
    # Pin the manifest version to the tag so the published version always matches the tag.
    - npm version "$VERSION" --no-git-tag-version --allow-same-version
    - npx @vscode/vsce package -o "time-tracking-$VERSION.vsix"
    - npx ovsx publish "time-tracking-$VERSION.vsix" -p "$OVSX_TOKEN"
  artifacts:
    paths:
      - "time-tracking-*.vsix"
    expire_in: never
